name: GitHub Profile Stats

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/profile_stats.yml

permissions:
  contents: write

concurrency:
  group: github-profile-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify profile token and private repository access
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
          	echo "::error::GH_TOKEN is missing. Add a token with read access to the private repositories to include."
          	exit 1
          fi
          profile=$(gh api graphql -f query='query { viewer { login repositories(first: 1, privacy: PRIVATE, ownerAffiliations: OWNER) { totalCount } } }')
          if ! jq -e --arg owner "$PROFILE_OWNER" '.data.viewer | (.login | ascii_downcase) == ($owner | ascii_downcase) and .repositories.totalCount > 0' <<< "$profile" > /dev/null; then
          	echo "::error::GH_TOKEN must belong to the profile owner and be able to read private repositories."
          	exit 1
          fi

      - name: Generate cards including accessible private activity
        uses: vn7n24fzkq/github-profile-summary-cards@7022eb6bd48de38b092f54110a8ff8185f2ac4a1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          # Generate all themes to keep existing cards available during activation.
          THEME: ''
          TIME_ZONE: America/Sao_Paulo
          AUTO_PUSH: false

      - name: Require and stage light, dark, and compatibility profile cards
        shell: bash
        run: |
          for theme in github github_dark gotham; do
          	for card in 3-stats.svg 2-most-commit-language.svg; do
          		source="profile-summary-card-output/$theme/$card"
          		if [ ! -s "$source" ]; then
          			echo "::error::The required $theme card $card was not generated. Check the generation errors above."
          			exit 1
          		fi
          		install -D "$source" "profile-stats/$theme/$card"
          	done
          done

      - name: Publish light and dark profile cards
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865
        with:
          target_branch: profile-stats
          build_dir: profile-stats
          commit_message: 'chore: refresh GitHub profile stats'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Activate theme-aware cards after publishing the images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess

          repository = os.environ["GITHUB_REPOSITORY"]
          owner = repository.split("/")[0]
          endpoint = f"repos/{repository}/contents/README.md"
          response = subprocess.run(
          	["gh", "api", f"{endpoint}?ref=master"],
          	check=True, stdout=subprocess.PIPE, text=True
          )
          readme = json.loads(response.stdout)
          content = base64.b64decode(readme["content"]).decode("utf-8")
          newline = "\r\n" if "\r\n" in content else "\n"
          updated = content
          for card, filename, alt in [
          	("stats", "3-stats.svg", "GitHub stats"),
          	("most-commit-language", "2-most-commit-language.svg", "Most used languages by commits")
          ]:
          	base = f"https://raw.githubusercontent.com/{repository}/profile-stats"
          	light = f"{base}/github/{filename}"
          	dark = f"{base}/github_dark/{filename}"
          	gotham = f"{base}/gotham/{filename}"
          	legacy = f"https://github-profile-summary-cards.vercel.app/api/cards/{card}?username={owner}&theme=github_dark"
          	picture = newline.join([
          		"<picture>",
          		f'\t<source media="(prefers-color-scheme: dark)" srcset="{gotham}" />',
          		f'\t<source media="(prefers-color-scheme: light)" srcset="{light}" />',
          		f'\t<img height="180" alt="{alt}" src="{light}" />',
          		"</picture>"
          	])
          	if picture in updated:
          		continue
          	images = [
          		f'<img height="180" alt="{alt}" src="{source}" />'
          		for source in [gotham, dark, legacy]
          	]
          	matches = [image for image in images if image in updated]
          	if len(matches) != 1 or updated.count(matches[0]) != 1:
          		raise RuntimeError(f"Expected exactly one standalone {card} card in README.md; check its markup.")
          	updated = updated.replace(matches[0], picture, 1)
          if updated != content:
          	payload = {
          		"message": "chore: adapt GitHub stats to light and dark modes",
          		"branch": "master",
          		"sha": readme["sha"],
          		"content": base64.b64encode(updated.encode("utf-8")).decode("ascii")
          	}
          	subprocess.run(
          		["gh", "api", "--method", "PUT", endpoint, "--input", "-", "--silent"],
          		input=json.dumps(payload), text=True, check=True
          	)
          	print("Activated light and dark profile cards in README.md.")
          else:
          	print("README.md already uses the published light and dark cards.")
          PY
